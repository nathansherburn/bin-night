name: Bin Night Reminder

on:
  schedule:
    - cron: '0 9 * * 1'   # Monday 7pm AEST — send the "put out tonight" reminder
    - cron: '0 20 * * *'  # 6am AEST daily — refresh the website data
  workflow_dispatch:       # allow manual trigger from the Actions tab

jobs:
  bins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests beautifulsoup4

      - name: Send reminder notification
        # Only on the Monday-evening schedule (and manual runs), not the daily refresh
        if: github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MESSAGE=$(python bin_night.py --notify)
          if [ -n "$MESSAGE" ]; then
            curl -s \
              -H "Title: Bin Night" \
              -H "Priority: high" \
              -d "$MESSAGE" \
              "https://ntfy.sh/$NTFY_TOPIC"
          fi

      - name: Update schedule data for web app
        run: |
          mkdir -p data
          python bin_night.py --json > data/schedule.json.tmp && mv data/schedule.json.tmp data/schedule.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --staged --quiet || git commit -m "Update bin schedule data"
          git push
