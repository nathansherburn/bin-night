name: Bin Night Reminder

on:
  schedule:
    - cron: '0 9 * * 1'  # 7pm AEST (9am UTC) every Monday
  workflow_dispatch:      # allow manual trigger from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests beautifulsoup4

      - name: Check bins and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          MESSAGE=$(python bin_night.py --notify)
          if [ -n "$MESSAGE" ]; then
            curl -s \
              -H "Title: Bin Night" \
              -H "Priority: high" \
              -d "$MESSAGE" \
              "https://ntfy.sh/$NTFY_TOPIC"
          fi

      - name: Update schedule data for web app
        run: |
          mkdir -p data
          python bin_night.py --json > data/schedule.json.tmp && mv data/schedule.json.tmp data/schedule.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --staged --quiet || git commit -m "Update bin schedule data"
          git push
